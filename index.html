<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Project Class - 07 QR Code Generator using HTML CSS & Javascript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Container -->
    <div class="container">
        <h2>🎯 QR Code Generator</h2>

        <!-- Input Section -->
        <div class="inputSection">
            <label for="text-input">Text or URL:</label>
            <input type="text" id="text-input" placeholder="Enter text or URL here..." />
        </div>

        <!-- Generate Button -->
        <button id="generate-btn">Generate QR Code</button>
        <!-- QR Code Display -->
        <img class="qr-code" src="" alt="Generated QR Code" srcset="" id="qr-code-img" />
    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
